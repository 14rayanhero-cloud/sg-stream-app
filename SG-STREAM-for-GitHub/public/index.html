<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SG STREAM</title>
<link rel="icon" type="image/png" href="logo-64.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<script src="lang-en.js"></script><script src="i18n.js"></script>
<style>
  :root { --bg:#070b16; --panel:#0d1326; --line:#1b2745; --txt:#e8ecf8; --mut:#8a94b2; --a:#00F0FF; --b:#9d4edd; --p:#ff007f; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 85% -10%,#1a1340,transparent 45%),var(--bg); color:var(--txt); font-family:'Cairo','Segoe UI',Tahoma,sans-serif; }
  #top { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 28px; background:rgba(7,11,22,.85); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  #top .brand { font-weight:800; font-size:20px; letter-spacing:.5px; } #top .brand b { color:var(--a); text-shadow:0 0 12px var(--a); } #top .brand i { color:var(--p); font-style:normal; }
  .col { min-width:0; }
  .live { display:inline-flex; gap:6px; align-items:center; padding:5px 12px; border-radius:99px; font-size:13px; border:1px solid var(--line); }
  .live.on { color:#5eead4; border-color:#14b8a6; box-shadow:0 0 12px #14b8a655; } .live.off { color:#fbbf24; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:14px; border:1px solid var(--line); background:#05070e repeating-conic-gradient(#0a0f1d 0 25%,#070a14 0 50%) 0 0/24px 24px; }
  .stage iframe { position:absolute; left:0; top:0; width:1920px; height:1080px; border:0; transform-origin:0 0; pointer-events:none; background:transparent; }
  .ctl { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; } .ctl label { display:block; font-size:13px; color:var(--mut); }
  .ctl input,.ctl select,.ctl textarea { margin:4px 0 0; width:100%; padding:9px 11px; background:#0a0e1c; border:1px solid var(--line); border-radius:10px; color:var(--txt); font:inherit; }
  .ctl input[type=color] { padding:2px; height:38px; } .ctl input[type=checkbox] { width:auto; }
  .msg { padding:10px 14px; border-radius:12px; margin-bottom:8px; background:#0a0e1c; border:1px solid var(--line); white-space:pre-wrap; line-height:1.7; } .msg.me { border-color:var(--b); }
  button { font:inherit; cursor:pointer; }
  .hidden { display:none !important; }
  /* login */
  #login { min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 70% 20%,#1a2250,transparent 50%),var(--bg); }
  .box { width:min(380px,92vw); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:28px; }
  .box h1 { margin:0 0 4px; font-size:22px; } .box p { margin:0 0 18px; color:var(--mut); font-size:14px; text-align:center; }
  input { width:100%; padding:11px 13px; margin-bottom:12px; background:#0a0e1c; border:1px solid var(--line); border-radius:10px; color:var(--txt); font:inherit; }
  input:focus { outline:2px solid var(--b); }
  .btn { width:100%; padding:11px; border:0; border-radius:10px; color:#06121a; font-weight:700; background:linear-gradient(90deg,var(--a),var(--b)); }
  .btn.sm { width:auto; padding:7px 14px; font-size:13px; }
  .btn.ghost { background:transparent; color:var(--txt); border:1px solid var(--line); }
  /* app */
  #app { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:16px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; overflow:auto; }
  .logo { font-weight:800; letter-spacing:1px; margin-bottom:12px; padding:0 8px; } .logo small { display:block; color:var(--mut); font-weight:400; letter-spacing:0; font-size:12px; }
  .grp { color:var(--mut); font-size:12px; padding:12px 8px 4px; }
  .nav { background:none; border:0; color:var(--txt); text-align:right; padding:9px 10px; border-radius:9px; display:flex; gap:8px; align-items:center; }
  .nav:hover { background:#161d33; } .nav.on { background:#17213d; box-shadow:inset 0 0 0 1px #2c3b66; }
  .user { margin-top:auto; padding:10px; border:1px solid var(--line); border-radius:12px; font-size:13px; }
  main { padding:28px 34px; max-width:1200px; }
  h2 { margin:0 0 4px; font-size:26px; } .sub { color:var(--mut); margin-bottom:20px; font-size:14px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:16px 0; }
  .chip { background:transparent; border:1px solid var(--line); color:var(--txt); padding:6px 14px; border-radius:99px; font-size:13px; }
  .chip.on { background:#17332f; border-color:var(--a); color:var(--a); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .tpl { background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .tpl.sel { border-color:var(--a); box-shadow:0 0 0 1px var(--a); }
  .pvbox { position:relative; width:100%; aspect-ratio:2/1; overflow:hidden; background:#070a14 repeating-conic-gradient(#0c1122 0 25%,#080b17 0 50%) 0 0/20px 20px; }
  .pvbox iframe { position:absolute; left:0; top:0; width:700px; height:350px; border:0; transform-origin:0 0; pointer-events:none; }
  .tpl .bd { padding:12px 14px; } .tpl h4 { margin:0 0 4px; } .tpl p { margin:0 0 10px; color:var(--mut); font-size:13px; }
  .tag { font-size:11px; padding:2px 8px; border-radius:99px; background:#2a2147; color:#c4b5fd; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; }
  .panel h3 { margin:0 0 12px; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  code { direction:ltr; display:block; background:#070a14; border:1px solid var(--line); padding:9px 12px; border-radius:9px; word-break:break-all; font-size:12.5px; text-align:left; margin:8px 0; }
  .stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat div { background:#0a0e1c; border:1px solid var(--line); border-radius:12px; padding:14px; } .stat b { display:block; font-size:26px; }
  @media (max-width:760px){ #app{grid-template-columns:1fr} aside{position:static;height:auto} main{padding:18px} }
  /* ---- header connect button ---- */
  button.live { background:transparent; font-family:inherit; cursor:pointer; transition:.25s; }
  button.live.off { color:#fbbf24; border-color:#7a5a12; } button.live.off:hover { background:#2a2108; box-shadow:0 0 16px #fbbf2455; }
  button.live.on { color:#5eead4; border-color:#14b8a6; background:linear-gradient(90deg,#062b25,#0a3a30); box-shadow:0 0 18px #14b8a688, inset 0 0 12px #14b8a633; animation:livePulse 2.2s infinite; }
  .pdot { display:inline-block; animation:dotPulse 1.2s infinite; }
  @keyframes dotPulse { 50% { transform:scale(1.45); opacity:.6; } } @keyframes livePulse { 50% { box-shadow:0 0 28px #14b8a6cc, inset 0 0 14px #14b8a655; } }
  /* ---- gradient / glow buttons ---- */
  .btn.glow { background:linear-gradient(90deg,#00F0FF,#9d4edd 60%,#ff007f); box-shadow:0 6px 22px #9d4edd55; transition:.2s; } .btn.glow:hover { transform:translateY(-1px); box-shadow:0 8px 28px #9d4edd99; }
  .btn:disabled { opacity:.55; cursor:default; }
  /* ---- toast ---- */
  #toasts { position:fixed; left:20px; bottom:20px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-start; }
  .toast { padding:12px 18px; border-radius:14px; background:rgba(13,19,38,.92); backdrop-filter:blur(10px); border:1px solid #14b8a6; box-shadow:0 8px 30px #000a, 0 0 18px #14b8a655; font-weight:700; transform:translateX(-30px); opacity:0; transition:.35s; max-width:min(92vw,460px); }
  .toast.warn { border-color:#fbbf24; box-shadow:0 8px 30px #000a, 0 0 18px #fbbf2455; } .toast.err { border-color:#f87171; box-shadow:0 8px 30px #000a, 0 0 18px #f8717155; } .toast.in { transform:none; opacity:1; }
  /* ---- glass modal ---- */
  .modal-bg { position:fixed; inset:0; z-index:150; display:grid; place-items:center; background:rgba(3,5,12,.6); backdrop-filter:blur(6px); opacity:0; transition:.25s; padding:16px; } .modal-bg.in { opacity:1; }
  .modal { position:relative; width:min(440px,100%); padding:26px; border-radius:22px; background:linear-gradient(160deg,rgba(40,30,90,.55),rgba(10,16,36,.78)); border:1px solid rgba(157,78,221,.5); box-shadow:0 20px 70px #000b, 0 0 40px #9d4edd44, inset 0 1px 0 rgba(255,255,255,.15); backdrop-filter:blur(18px); transform:translateY(14px) scale(.97); transition:.25s; }
  .modal-bg.in .modal { transform:none; } .modal .x, .drawer .x { position:absolute; top:12px; left:12px; border:0; background:rgba(255,255,255,.08); color:var(--txt); width:32px; height:32px; border-radius:50%; } .drawer .x { position:static; }
  .modal .mt { font-size:22px; font-weight:800; margin-bottom:6px; } .modal .mp { color:var(--mut); margin:0 0 16px; font-size:14px; } .err { color:#f87171; font-size:13px; min-height:18px; margin-bottom:8px; }
  .okbox { background:#0a2f27; border:1px solid #14b8a6; border-radius:12px; padding:10px 14px; margin-bottom:12px; color:#5eead4; }
  /* ---- slide-over drawer ---- */
  .drawer-bg { position:fixed; inset:0; z-index:140; background:rgba(3,5,12,.55); backdrop-filter:blur(3px); opacity:0; transition:.3s; } .drawer-bg.in { opacity:1; }
  .drawer { position:absolute; top:0; bottom:0; left:0; width:min(480px,100%); background:linear-gradient(180deg,#0f1530,#090d1d); border-right:1px solid var(--line); box-shadow:20px 0 60px #000a; transform:translateX(-100%); transition:.32s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; }
  .drawer-bg.in .drawer { transform:none; } .drawer .dh { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); font-size:18px; } .drawer .db { padding:18px 20px; overflow:auto; flex:1; }
  .pvbox.big { aspect-ratio:2/1; border-radius:14px; border:1px solid var(--line); }
  .czgrid { display:grid; gap:14px; } .czrow { display:block; color:var(--mut); font-size:13px; } .czrow b { color:var(--a); margin-inline-start:6px; } .czrow input[type=range] { width:100%; margin:8px 0 0; padding:0; accent-color:#9d4edd; } .czrow select { width:100%; margin-top:6px; padding:9px; background:#0a0e1c; border:1px solid var(--line); border-radius:10px; color:var(--txt); font:inherit; }
  .seg { display:flex; gap:6px; margin-top:6px; } .seg button { flex:1; padding:8px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--txt); } .seg button.on { background:#17332f; border-color:var(--a); color:var(--a); } .seg button:disabled { opacity:.4; }
  /* ---- template cards ---- */
  .tpl.sel { border-color:#14b8a6; box-shadow:0 0 0 1px #14b8a6, 0 0 24px #14b8a633; } .live-tag { background:#0f3a31; color:#5eead4; } .tpl .cta { flex:1 1 100%; }
  .tpl .acts { display:flex; gap:8px; flex-wrap:wrap; } .tpl .acts .btn.ghost { flex:1; }
  .tpl:hover { border-color:#3b4a7a; transform:translateY(-2px); transition:.2s; }
  .top.srch { flex-wrap:nowrap; align-items:center; } .top.srch input { width:260px; margin:0; }
  @media (max-width:760px){ .top.srch { flex-wrap:wrap; } }
  /* ---- control deck ---- */
  .deck { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
  .dk { border:1px solid var(--line); border-radius:16px; padding:16px 12px; background:linear-gradient(160deg,#121a38,#0b1022); color:var(--txt); font-weight:800; text-align:center; transition:.18s; } .dk span { display:block; font-size:30px; margin-bottom:6px; }
  .dk:hover { transform:translateY(-3px); border-color:var(--b); box-shadow:0 10px 26px #9d4edd33; } .dk:active { transform:scale(.97); }
  .dk.hot { background:linear-gradient(160deg,#3a1050,#14103a); border-color:#ff007f88; } .dk.gold { background:linear-gradient(160deg,#3a2a08,#17110a); border-color:#fbbf2488; }
  /* ---- misc pages ---- */
  .seglist { display:grid; gap:8px; } .seglist .r { display:grid; grid-template-columns:1fr 54px 40px; gap:8px; align-items:center; } .seglist input[type=color] { padding:2px; height:38px; margin:0; }
  html[dir=ltr] .nav { text-align:left } html[dir=ltr] aside { border-left:0; border-right:1px solid var(--line) } html[dir=ltr] .tbl th { text-align:left } html[dir=ltr] .modal .x { left:auto; right:12px } html[dir=ltr] #toasts { left:auto; right:20px; align-items:flex-end } html[dir=ltr] body { font-family:'Cairo','Segoe UI',system-ui,sans-serif }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; } .tbl th { text-align:right; color:var(--mut); font-weight:600; padding:6px; } .tbl td { padding:5px; } .tbl input,.tbl select { margin:0; padding:7px 8px; }
  .canvasbox { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; } @media (max-width:1100px){ .canvasbox { grid-template-columns:1fr; } }
  .layer { display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:#0a0e1c; } .layer small { color:var(--mut); }
  .handle { position:absolute; border:2px dashed rgba(0,240,255,.8); background:rgba(0,240,255,.08); cursor:grab; display:grid; place-items:center; font-size:12px; color:#00F0FF; user-select:none; } .handle:active { cursor:grabbing; }
  .stage.v { aspect-ratio:9/16; max-height:660px; width:auto; margin:0 auto; }
</style>
</head>
<body>

<section id="login">
  <form class="box" id="lf">
    <div style="text-align:center;margin-bottom:6px"><button type="button" class="sg-lang" onclick="SGLang.toggle()" style="background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:5px 14px;cursor:pointer;font:inherit;font-size:13px">English</button></div><img src="logo.png" alt="SG STREAM" width="96" height="96" style="display:block;margin:0 auto 12px"><h1 style="text-align:center">SG STREAM</h1>
    <p id="lp">سجّل الدخول للوصول إلى لوحة التحكم</p>
    <input id="u" placeholder="اسم المستخدم (إنجليزي، يفضّل نفس حساب TikTok)" autocomplete="username" required>
    <input id="p" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" required>

    <div class="user"><b id="un"></b><br><button class="btn ghost sm" id="bk-save" style="margin-top:8px" title="تنزيل نسخة من كل إعداداتك">💾 نسخة احتياطية</button> <button class="btn ghost sm" id="bk-load" style="margin-top:8px" title="استرجاع إعداداتك من ملف نسخة احتياطية">📂 استرجاع</button><input type="file" id="bk-file" accept=".json,application/json" style="display:none"><br><button class="btn ghost sm" id="out" style="margin-top:8px">خروج</button></div>

  <div class="col">

<script src="shared.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
let me = null, user = null, registering = false;
const api = async (p, body) => {
  let r;
  try { r = await fetch(p, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw new Error(location.protocol === 'file:' ? 'أنت فاتح الملف مباشرة. شغّل «Start SG STREAM» (الملف الأسود) ثم افتح http://localhost:3000 في المتصفح' : 'لا يوجد اتصال بالخادم. تأكد أن النافذة السوداء (Start SG STREAM) ما زالت مفتوحة'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 402 && j.error === 'PRO_REQUIRED' && typeof openPricing === 'function') openPricing('هذه الميزة للمشتركين في PRO');
  if (r.status === 401 && j.error === 'غير مسجّل') { setTimeout(() => location.reload(), 1800); throw new Error('انتهت جلستك (الخادم أُعيد تشغيله). سجّل الدخول من جديد…'); }
  if (!r.ok) throw new Error(j.error || 'خطأ');
  return j;
};
// Refreshing the account (status polls, connect, ...) must never swap in the server's copy of the settings:
// pages hold references into me.cfg and edits are saved with a short delay, so the local copy stays the source of truth.
const setMe = (m) => { if (m && me && me.cfg && m.name === me.name) m = { ...m, cfg: me.cfg }; me = m; user = m ? (m.tiktok || m.name) : null; };
let selected = store.get('lsx-selected', 'gift-rocket');
let cat = 'all', query = '', view = 'home';
const go = (v) => { view = v; document.querySelectorAll('.nav').forEach(x => x.classList.toggle('on', x.dataset.v === v)); render(); };
// ---- test helpers: send sample events to local previews and to real OBS overlays ----
const NAMES = ['سارة', 'أحمد', 'Lina', 'خالد', 'Noor'];
const pick = () => NAMES[Math.random() * NAMES.length | 0];
const fire = (ev) => { emit(ev); api('/api/test', ev).catch(() => {}); store.set('lsx-acted', true); };
const SAMPLES = {
  gift: () => ({ type: 'gift', user: pick(), gift: 'Rose', count: 1 + (Math.random() * 4 | 0), team: Math.random() < .5 ? 'A' : 'B' }),
  follow: () => ({ type: 'follow', user: pick() }),
  like: () => ({ type: 'like', user: pick(), count: 1 + (Math.random() * 9 | 0) }),
  chat: () => ({ type: 'chat', user: pick(), text: 'مرحبا من البث!' }),
  spin: () => ({ type: 'spin' }),
  fxgift: () => ({ type: 'gift', user: pick(), gift: 'Lion', count: 1, diamonds: 29999 }),
  jarGift: () => { const g = [['Rose', 1], ['Heart', 1], ['Lion', 29999], ['Diamond', 5], ['Rose', 1], ['Doughnut', 30]][Math.random() * 6 | 0], n = 1 + (Math.random() * 6 | 0); return { type: 'gift', user: pick(), gift: g[0], count: n, diamonds: g[1] * n }; },
  chatTw: () => ({ type: 'chat', user: pick(), text: 'GG! رائع', platform: 'twitch', sub: Math.random() < .5 }),
};
const kindsFor = (tpl) => {

      <div class="sub" style="margin:10px 0 0">الرابط الحالي لقالب: <span dir="ltr" style="unicode-bidi:isolate">${esc(ovUrl('goal-bar').slice(0, 70))}…</span>${/localhost|127\.0\.0\.1/.test(ovUrl('goal-bar')) ? ' <b style="color:#fbbf24">⚠ هذا العنوان يعمل على جهازك فقط</b>' : ''}</div></div>`);
    $('#bs').onclick = () => { store.set('lsx-base', $('#bu').value.trim()); $('#bm').textContent = 'تم الحفظ ✓'; render(); };
    $('#bc').onclick = () => { store.set('lsx-base', ''); render(); };
    api('/api/net').then(n => { const l = $('#lan'); if (l) l.innerHTML = n.ips.length ? '<span class="sub" style="margin:0">على نفس الشبكة (واي فاي):</span>' + n.ips.map(ip => `<button class="btn ghost sm" data-ip="http://${ip}:${n.port}">http://${ip}:${n.port}</button>`).join('') : ''; l?.querySelectorAll('[data-ip]').forEach(b => b.onclick = () => { $('#bu').value = b.dataset.ip; }); }).catch(() => {});
  } else {
    const t = TEMPLATES.find(x => x.id === selected);
    const done = [!!(me.connected || (me.twitch && me.twitch.connected) || (me.kick && me.kick.connected)), !!t, !!store.get('lsx-acted', false), !!store.get('lsx-obs', false)];
    const steps = [
      ['اربط حسابك (TikTok أو Twitch أو Kick)', me.connected ? `TikTok @${user} متصل` : (me.twitch && me.twitch.connected) ? `Twitch #${me.twitch.channel} متصل` : (me.kick && me.kick.connected) ? `Kick ${me.kick.channel} متصل` : 'اضغط الزر بالأعلى واتصل ببثك', 'conn'],
      ['جهّز توبيك من القوالب', t ? `لديك توبيك جاهز: ${t.name}` : 'اختر قالباً', 'overlays'],
      ['أنشئ إجراء', 'اربط الهدية أو التعليق بتنبيه أو رسالة (جرّبه من الاختبار).', 'test'],
      ['وابدأ OBS ضع مصدر', 'انسخ رابط الشاشة وأضفه كـ Browser Source بمقاس 1920×1080.', 'obs'],
    ];
    const next = done.indexOf(false);
    const tools = [['🔊', 'الأصوات والتنبيهات', 'ملف صوتي لكل حدث', 'test'], ['🗣️', 'TTS قارئ النصوص', 'قراءة التعليقات والهدايا', 'test'],
      ['🔗', 'ويدجت السوشيال', 'حساباتك على الشاشة', 'overlays'], ['🎮', 'الألعاب التفاعلية', 'ألعاب تعتمد على التعليقات', 'overlays'],
      ['🤖', 'الشات بوت', 'أوامر وردود جاهزة', 'bot'], ['🎵', 'طلبات الأغاني', 'طلبات وتشغيل للمشاهدين', 'test'],
      ['🖼️', 'استوديو النص والصورة', 'لوحات نصية وصور جاهزة', 'overlays'], ['🖥️', 'نوافذ OBS', 'روابط الشاشة جاهزة', 'obs']];
    const st = me.stats || {};
    m.innerHTML = `
      <div class="stat" style="margin-bottom:16px">
        <div><small style="color:var(--mut)">متابعون جدد</small><b id="st-f" style="color:var(--a)">${st.followers || 0}</b></div>
        <div><small style="color:var(--mut)">المشاهدات الحالية</small><b id="st-w" style="color:var(--b)">${st.watching || 0}</b></div>
        <div><small style="color:var(--mut)">إجمالي الهدايا</small><b id="st-g" style="color:var(--p)">${st.gifts || 0}</b></div>
        <div><small style="color:var(--mut)">رسائل الشات</small><b id="st-c">${st.chats || 0}</b></div></div>
      <div class="panel" style="padding:0;overflow:hidden">
        <div style="padding:26px 28px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center">
          <div><small style="color:var(--mut)">لوحة البداية</small><h2 style="font-size:32px;margin:6px 0">أهلاً بك في SG STREAM</h2>
          <div class="sub" style="margin:0;max-width:520px">استوديو بث TikTok LIVE: توبيكات وإجراءات وأصوات تشتغل لحظة ما تصل الهدية أو التعليق. أربع خطوات تفصلك عن أول بث متكامل.</div></div>
          <div class="row"><button class="btn ghost sm" data-g="obs">دليل الإعداد</button><button class="btn sm" data-g="test">أنشئ إجراء</button></div></div>
        <div class="stat" style="border-top:1px solid var(--line);gap:0">
          <div style="border:0"><small style="color:var(--mut)">حساب TikTok</small><b style="font-size:20px;direction:ltr;text-align:right">@${esc(user)}</b></div>
          <div style="border:0"><small style="color:var(--mut)">التويبكات</small><b style="color:var(--b)">${t ? 1 : 0}</b></div>
          <div style="border:0"><small style="color:var(--mut)">الإجراءات</small><b>${store.get('lsx-acted', false) ? 1 : 0}</b></div></div></div>
      <h3 style="margin:22px 0 4px">طريق التجهيز</h3><div class="sub">${done.filter(Boolean).length} من 4 — كل خطوة تفتح الصفحة التي تنفذها فعلاً.</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${steps.map((s, i) => `
        <div class="tpl ${i === next ? 'sel' : ''}"><div class="bd"><small style="color:${done[i] ? 'var(--a)' : 'var(--mut)'}">الخطوة ${i + 1} • ${done[i] ? '✓ مكتملة' : i === next ? 'التالية' : 'لاحقاً'}</small>
          <h4 style="margin:8px 0 4px">${s[0]}</h4><p>${s[1]}</p><button class="btn ghost sm" data-g="${s[2]}">${done[i] ? 'مراجعة' : 'افتح'}</button></div></div>`).join('')}</div>
      <h3 style="margin:26px 0 4px">بقيّة الأدوات</h3><div class="sub">ليست مطلوبة للبدء — افتحها بعد أن يعمل أول بث.</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${tools.map(x => `
        <button class="tpl" data-g="${x[3]}" style="text-align:right;color:inherit;padding:14px"><b>${x[0]} ${x[1]}</b><p style="margin:4px 0 0">${x[2]}</p></button>`).join('')}</div>
      <div class="panel" style="margin-top:22px"><h3>الشرح والمساعدة</h3><span class="sub">دليل الإعداد، الدروس، حل المشاكل، الدعم والاشتراك.</span></div>`;
    m.querySelectorAll('[data-g]').forEach(b => b.onclick = () => go(b.dataset.g));
  }
}
boot();
</script>

<script src="views2.js"></script>
<script src="views3.js"></script>
<script src="views4.js"></script>
<script src="views5.js"></script>
</body>
