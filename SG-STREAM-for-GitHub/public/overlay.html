<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:transparent; font-family:'Cairo','Segoe UI',Tahoma,sans-serif; color:#fff; overflow:hidden; }
  #root { position:absolute; inset:0; padding:20px; }
  #root > * { margin-right:auto; } /* RTL page: keep overlays at the left edge of the OBS canvas */
  .card { background:rgba(10,14,26,var(--bgA,.82)); border:1px solid rgba(255,255,255,.12); border-radius:16px; padding:14px 18px; backdrop-filter:blur(6px); }
  .row { display:flex; justify-content:space-between; gap:12px; padding:4px 0; }
  .bar { height:16px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; transition:width .6s; }
  @keyframes mq { to { transform:translateX(-100%); } }
  @keyframes drop { from { opacity:0; transform:translateY(-30px) scale(.9); } }
  @keyframes slide { from { opacity:0; transform:translateX(24px); } }
  @keyframes rise { from { opacity:1; transform:translateY(0) scale(.6); } to { opacity:0; transform:translateY(-420px) scale(1.4); } }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  .pop { position:absolute; top:30px; left:50%; transform:translateX(-50%) scale(.6); opacity:0; transition:.35s; font-size:26px; font-weight:800; text-align:center; }
  .pop.on { opacity:1; transform:translateX(-50%) scale(1); }
  /* timers */
  .timer { font:900 76px/1 'Cairo',Consolas,monospace; text-align:center; --c:#fbbf24; color:var(--c); text-shadow:0 0 18px var(--c); font-variant-numeric:tabular-nums; }
  .timer.neon { --c:#00F0FF; } .timer.fire { --c:#ff7a18; }
  /* alert cards */
  .alc { min-width:400px; max-width:760px; text-align:center; padding:18px 26px; font-size:28px; font-weight:800; animation:var(--in,drop .5s); --c:#00F0FF; }
  /* entry animations chosen in the customise drawer */
  .an-slide { --in:drop .5s; } .an-zoom { --in:zoomIn .5s; } .an-bounce { --in:bounceIn .8s; } .an-flip { --in:flipIn .7s; } .an-fade { --in:fadeIn .7s; }
  @keyframes zoomIn { from { opacity:0; transform:scale(.3); } }
  @keyframes bounceIn { 0% { opacity:0; transform:translateY(-120px); } 55% { opacity:1; transform:translateY(14px); } 75% { transform:translateY(-8px); } 100% { transform:none; } }
  @keyframes flipIn { from { opacity:0; transform:perspective(600px) rotateX(-90deg); } }
  @keyframes fadeIn { from { opacity:0; } }
  @keyframes entSlide { from { opacity:0; transform:translateX(60px); } } @keyframes entZoom { from { opacity:0; transform:scale(.4); } }
  @keyframes entBounce { 0% { opacity:0; transform:translateY(-40px); } 60% { opacity:1; transform:translateY(8px); } 100% { transform:none; } }
  @keyframes entFlip { from { opacity:0; transform:perspective(500px) rotateX(-80deg); } } @keyframes entFade { from { opacity:0; } }
  @keyframes giftRise { 0% { opacity:0; transform:translateY(0) scale(.5); } 15% { opacity:1; } 60% { transform:translateY(-300px) scale(1.25); } 100% { opacity:0; transform:translateY(-460px) scale(1); } }
  .ent-slide { animation:entSlide .5s; } .ent-zoom { animation:entZoom .5s; } .ent-bounce { animation:entBounce .7s; } .ent-flip { animation:entFlip .6s; } .ent-fade { animation:entFade .6s; }
  .toprow { position:absolute; left:0; right:0; height:46px; transition:top .65s cubic-bezier(.2,.8,.2,1), opacity .4s, transform .5s; }
  .toprow .sc { display:inline-block; }
  .toprow .bump { animation:pulse .45s; }
  .alc img { max-height:170px; max-width:100%; border-radius:12px; display:block; margin:0 auto 10px; }
  .al-neon { background:rgba(8,10,24,.9); border:2px solid var(--c); border-radius:18px; box-shadow:0 0 30px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 20px color-mix(in srgb,var(--c) 25%,transparent); }
  .al-glass { background:rgba(255,255,255,.1); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.35); border-radius:30px; box-shadow:0 10px 40px color-mix(in srgb,var(--c) 45%,transparent); }
  .al-comic { background:var(--c); color:#111; border:5px solid #111; border-radius:6px; box-shadow:8px 8px 0 #111; transform:rotate(-2deg); font-weight:900; }
  .al-cyber { background:#070b16; border-inline:5px solid var(--c); border-radius:0; clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px); letter-spacing:1px; text-shadow:0 0 12px var(--c); }
  .al-minimal { background:transparent; border-bottom:4px solid var(--c); border-radius:0; font-size:36px; text-shadow:0 2px 12px #000; }
  .al-gold { background:linear-gradient(135deg,#2a1d04,#120d02); color:#fde68a; border:2px solid #fbbf24; border-radius:14px; box-shadow:0 0 26px rgba(251,191,36,.55); }
  .al-laser { background:#06060f; border:0; border-radius:4px; box-shadow:0 0 0 2px var(--c),0 0 28px var(--c); background-image:linear-gradient(100deg,transparent 40%,color-mix(in srgb,var(--c) 55%,transparent) 50%,transparent 60%); background-size:250% 100%; animation:var(--in,drop .5s),sweep 1.6s linear infinite; }
  @keyframes sweep { from { background-position:200% 0; } to { background-position:-100% 0; } }
  .al-liquid { background:linear-gradient(135deg,#f8f8fa,#8c8f9a 40%,#e9ebf2 60%,#6b6f7c); color:#14161c; border-radius:40px 14px 40px 14px; border:2px solid #fff; box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 0 18px #fff9; text-shadow:0 1px 0 #fff8; }
  .al-coins { background:radial-gradient(circle at 20% 20%,#ffe27a,#d89a00 55%,#6b4300); color:#2b1a00; border-radius:60px; border:3px solid #fff0a0; box-shadow:0 0 30px #f5b80099; }
  .al-coins::before { content:'🪙'; margin-inline-end:10px; display:inline-block; animation:spin 1.4s linear infinite; }
  @keyframes spin { to { transform:rotateY(360deg); } }
  .al-heartbeat { background:rgba(20,6,12,.92); border:2px solid var(--c); border-radius:26px; box-shadow:0 0 30px var(--c); animation:var(--in,drop .5s),beat 1s .5s infinite; }
  .al-heartbeat::before { content:'❤'; color:var(--c); margin-inline-end:10px; }
  @keyframes beat { 0%,100% { transform:scale(1); } 15% { transform:scale(1.07); } 30% { transform:scale(1); } 45% { transform:scale(1.05); } }
  .al-fire { background:linear-gradient(0deg,#ff4500,#ff9a1f 40%,#2a0800 100%); color:#fff7e0; border-radius:16px 16px 40px 40px; border:2px solid #ffb347; box-shadow:0 -10px 40px #ff6a0099; text-shadow:0 0 12px #ff3d00; }
  .al-hologram { background:linear-gradient(180deg,color-mix(in srgb,var(--c) 28%,transparent),color-mix(in srgb,var(--c) 6%,transparent)); background-image:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff12 3px 4px); border:1px solid var(--c); border-radius:6px; box-shadow:0 0 24px var(--c); text-shadow:0 0 10px var(--c); animation:var(--in,drop .5s),flick 2.4s infinite; }
  @keyframes flick { 0%,92%,100% { opacity:1; } 94% { opacity:.55; } 96% { opacity:.9; } }
  .al-lightning { background:#05060d; border:2px solid #cfe3ff; border-radius:8px; box-shadow:0 0 12px #fff,0 0 36px #6aa8ff; text-shadow:0 0 14px #6aa8ff; animation:var(--in,drop .5s),zap 1.2s infinite; }
  @keyframes zap { 0%,90%,100% { filter:none; } 92% { filter:brightness(2.2); } 95% { filter:brightness(1); } 97% { filter:brightness(2.6); } }
  .al-lantern,.al-mosque,.al-lattice,.al-tasbih,.al-manuscript,.al-stardust { font-family:'Cairo','Amiri',serif; color:#fff3c9; border-radius:22px; }
  .al-lantern { background:linear-gradient(180deg,#3a1304,#150600); border:2px solid #f3c969; box-shadow:0 0 34px #f3c96988; }
  .al-lantern::before { content:'🏮'; display:block; font-size:44px; animation:swing 2.4s ease-in-out infinite; transform-origin:top center; }
  @keyframes swing { 0%,100% { transform:rotate(-8deg); } 50% { transform:rotate(8deg); } }
  .al-mosque { background:linear-gradient(180deg,#0a2540,#05121f); border:2px solid #f3c969; border-radius:60px 60px 18px 18px; box-shadow:0 0 30px #f3c96977; }
  .al-mosque::before { content:'🕌'; display:block; font-size:40px; }
  .al-lattice { background:#0b3b3a; background-image:radial-gradient(circle,#f3c96933 2px,transparent 3px),linear-gradient(45deg,#f3c96914 25%,transparent 25% 75%,#f3c96914 75%); background-size:22px 22px,22px 22px; border:3px double #f3c969; }
  .al-tasbih { background:#1b1030; border:2px dashed #f3c969; border-radius:90px; box-shadow:0 0 28px #a78bfa66; }
  .al-tasbih::before { content:'📿'; margin-inline-end:10px; }
  .al-manuscript { background:#e9d8a6; color:#3b2408; border:6px double #8a5a14; border-radius:6px; box-shadow:0 6px 24px #0008; text-shadow:none; }
  .al-stardust { background:radial-gradient(circle at 50% 0,#2a1d04,#0a0700); border:1px solid #f3c969; box-shadow:0 0 40px #f3c969aa; text-shadow:0 0 12px #f3c969; }
  .al-stardust::after { content:'✨ ✦ ✨'; display:block; opacity:.8; letter-spacing:8px; animation:pulse 1.6s infinite; }
  .dh { font:800 54px/1.4 'Cairo','Amiri',serif; text-align:center; color:#f3c969; text-shadow:0 0 18px #f3c96988; animation:dhin .9s; min-width:520px; padding:14px 30px; }
  @keyframes dhin { from { opacity:0; transform:translateY(16px) scale(.96); } }
  .dh.classic { border:3px double #f3c969; border-radius:60px; background:rgba(20,10,0,.78); }
  .dh.book { background:linear-gradient(90deg,#efe0b0,#fff7dc 50%,#efe0b0); color:#4a2c08; text-shadow:none; border-radius:8px 8px 28px 28px; box-shadow:inset 0 0 30px #8a5a14aa,0 6px 24px #000a; }
  .dh.brush { color:#fff; text-shadow:3px 3px 0 #b8860b,0 0 24px #000; transform:rotate(-2deg); }
  .dh.cards { background:#0b3b3a; border:2px solid #f3c969; border-radius:18px; box-shadow:10px 10px 0 #f3c96955; }
  .dh.water { -webkit-box-reflect:below -6px linear-gradient(transparent 55%,#fff5); }
  .dh.d3 { color:#ffe08a; text-shadow:1px 1px 0 #b8860b,2px 2px 0 #9a6f08,3px 3px 0 #7a5606,4px 4px 0 #5a3f04,6px 10px 18px #000a; }
  .dh.classic::before,.dh.bar::before { content:'☪ ✦'; position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:26px; letter-spacing:8px; color:#f3c969; text-shadow:0 0 10px #f3c969; }
  .dh.classic,.dh.bar { position:relative; }
  .dh.bar { font-size:30px; min-width:760px; background:linear-gradient(90deg,transparent,rgba(10,30,50,.9) 15%,rgba(10,30,50,.9) 85%,transparent); border-block:2px solid #f3c969; }
  .dh.medal { border-radius:50%; width:340px; height:340px; min-width:0; padding:30px; box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-size:38px; line-height:1.5; border:4px double #f3c969; background:radial-gradient(circle,#1b3a5a,#06101c); }
  .dh.light { color:#fff; text-shadow:0 0 10px #fff,0 0 30px #ffe08a,0 0 70px #f3c969; }
  .dh.star { background:linear-gradient(100deg,transparent,#f3c96933,transparent); background-size:200% 100%; animation:dhin .9s,sweep 3s linear infinite; }
  .dh.mosaic { background:conic-gradient(from 45deg,#0b3b3a,#1b3b6b,#0b3b3a,#7a5606,#0b3b3a); border:3px solid #f3c969; border-radius:14px; color:#fff7d0; }
  .ls { display:flex; align-items:center; gap:14px; padding:12px 24px; border:2px solid var(--b); border-radius:16px; background:var(--bg); color:var(--tx); box-shadow:0 0 26px var(--g); min-width:360px; }
  .ls small { display:block; font-size:14px; opacity:.75; letter-spacing:1px; }
  .ls b { font-size:30px; font-weight:900; }
  .gt { width:560px; padding:12px 20px; border-radius:18px; background:rgba(10,14,26,.82); border:1px solid color-mix(in srgb,var(--c1) 55%,transparent); box-shadow:0 0 24px color-mix(in srgb,var(--c1) 35%,transparent); }
  .gt .gh { display:flex; justify-content:space-between; font-weight:800; font-size:20px; margin-bottom:8px; }
  .gt .gb { position:relative; height:26px; border-radius:99px; background:rgba(255,255,255,.12); }
  .gt .gb i { position:absolute; inset:0 auto 0 0; border-radius:99px; width:0; background:linear-gradient(90deg,var(--c1),var(--c2)); transition:width .7s; }
  .gt .gb em { position:absolute; top:50%; font-style:normal; font-size:34px; transform:translate(-50%,-50%); transition:left .7s; filter:drop-shadow(0 2px 6px #000); }  .al-crescent { background:linear-gradient(135deg,#0d1b3a,#1b2d63); border:2px solid #f3c969; border-radius:30px; box-shadow:0 0 30px #f3c96977; font-family:'Cairo',serif; color:#fff3c9; }
  .al-crescent::before { content:'🌙'; display:block; font-size:42px; filter:drop-shadow(0 0 12px #f3c969); }
  .al-fanous { background:radial-gradient(circle at 50% 0,#ffb347 0,#7a2e00 55%,#1a0800); border:2px solid #ffd27a; border-radius:30px 30px 60px 60px; box-shadow:0 0 44px #ff9a2faa; color:#fff7e0; font-family:'Cairo',serif; animation:var(--in,drop .5s),flick 3s infinite; }
  .al-arabesque { background:#12332b; background-image:radial-gradient(circle at 50% 50%,transparent 9px,#f3c96922 10px,transparent 12px); background-size:28px 28px; border:3px double #f3c969; border-radius:12px; color:#fff3c9; font-family:'Cairo',serif; }
  .al-night { background:linear-gradient(180deg,#02030f,#0b1b45); border:1px solid #8fa8ff; border-radius:20px; box-shadow:0 0 34px #4f6bff77; color:#e8eeff; font-family:'Cairo',serif; }
  .al-night::before { content:'✦ ✧ ✦'; display:block; letter-spacing:10px; color:#cfe0ff; animation:pulse 1.8s infinite; }
  .al-emerald { background:linear-gradient(135deg,#052e22,#0e6b4b); border:2px solid #5eead4; border-radius:20px; box-shadow:0 0 30px #10b98177; color:#eafff7; font-family:'Cairo',serif; }
  .al-eid { background:linear-gradient(135deg,#7c2d12,#f59e0b 55%,#7c2d12); border:3px solid #fff0b8; border-radius:40px; box-shadow:0 0 40px #fbbf2499; color:#fff; text-shadow:0 2px 8px #000a; }
  .al-eid::before { content:'🎉 🌙 🎉'; display:block; letter-spacing:6px; }
  .dh.neon { color:#7dfcff; text-shadow:0 0 8px #00f0ff,0 0 26px #00f0ff,0 0 60px #0090ff; border:2px solid #00f0ff; border-radius:16px; box-shadow:0 0 24px #00f0ff88,inset 0 0 24px #00f0ff44; background:rgba(0,10,20,.7); }
  .dh.fire { color:#ffe9a8; text-shadow:0 -4px 14px #ff6a00,0 -10px 30px #ff3d00,0 0 4px #fff; }
  .dh.glass { background:rgba(255,255,255,.12); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.4); border-radius:30px; color:#fff; text-shadow:0 2px 10px #0008; }
  .dh.scroll { background:linear-gradient(90deg,#c9a45c,#f1dfae 10%,#f1dfae 90%,#c9a45c); color:#4a2c08; text-shadow:none; border-radius:10px; box-shadow:0 6px 20px #000a; }
  .dh.emerald { background:linear-gradient(135deg,#052e22,#0e6b4b); color:#eafff7; border:3px solid #f3c969; border-radius:18px; text-shadow:0 0 12px #5eead4; }
  .dh.sunrise { background:linear-gradient(180deg,#1e1b4b,#be185d 55%,#f59e0b); color:#fff; border-radius:22px; text-shadow:0 2px 10px #0009; }
  .rs { position:absolute; top:0; pointer-events:none; animation:rsfall linear infinite; }
  @keyframes rsfall { from { transform:translateY(-60px) rotate(0); opacity:0; } 10% { opacity:1; } to { transform:translateY(105vh) rotate(40deg); opacity:0; } }
  @keyframes rsup { from { transform:translateY(105vh) rotate(-6deg); opacity:0; } 15% { opacity:1; } to { transform:translateY(-80px) rotate(6deg); opacity:0; } }
  .alc.big { position:relative; font-size:34px; padding:24px 38px; animation:var(--in,drop .5s), pulse 1s .5s 3; }
  /* leaderboard */
  .toprow { display:flex; align-items:center; gap:10px; padding:7px 12px; border-radius:99px; }
  /* chat variants */
  .chat div { padding:4px 0; animation:in .3s; } @keyframes in { from { opacity:0; transform:translateY(8px); } }
  .chat b { color:#00F0FF; }
  .chat.neon { border:2px solid #00F0FF; box-shadow:0 0 22px #00F0FF88; background:rgba(5,8,20,.85); } .chat.neon b { color:#ff007f; text-shadow:0 0 8px #ff007f; }
  .chat.terminal { background:#000; border:1px solid #22c55e; border-radius:6px; font-family:Consolas,monospace; color:#4ade80; direction:ltr; text-align:left; } .chat.terminal b { color:#86efac; }
  .bub { display:block; width:fit-content; max-width:100%; padding:8px 14px; margin:6px 0; border-radius:18px 18px 4px 18px; background:linear-gradient(135deg,#7c3aed,#ec4899); animation:in .3s; }
  .bub.b2 { border-radius:18px 18px 18px 4px; background:linear-gradient(135deg,#0891b2,#2563eb); }
  /* ticker variants */
  #tk { position:absolute; left:0; right:0; bottom:0; overflow:hidden; white-space:nowrap; direction:ltr; background:linear-gradient(90deg,rgba(10,14,26,.92),rgba(40,16,70,.92)); border-top:2px solid #00F0FF; padding:12px 0; font-size:24px; font-weight:700; }
  #tk.neon { background:rgba(4,6,16,.92); border-top:0; border-bottom:0; box-shadow:0 0 24px #00F0FF88; color:#00F0FF; text-shadow:0 0 10px #00F0FF; border-block:2px solid #00F0FF; }
  #tk.glass { left:40px; right:40px; bottom:30px; border-radius:99px; background:rgba(255,255,255,.1); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.3); }

  #sg { display:flex; gap:6px; } #sg i { flex:1; height:20px; border-radius:5px; background:rgba(255,255,255,.12); transition:.4s; }

  #uc { display:flex; flex-direction:column; justify-content:flex-end; gap:6px; width:520px; height:calc(100vh - 40px); overflow:hidden; }
  body.demo #uc { height:100%; }
  /* ===== gift jar (الحصالة): every gift drops into a glass jar and piles up ===== */
  #jw { position:absolute; left:30px; bottom:12px; width:460px; height:800px; --jc:#bfe3ff; --jg:rgba(160,205,255,.45); }
  #jw.gold { --jc:#fbbf24; --jg:rgba(251,191,36,.5); } #jw.neon { --jc:#00F0FF; --jg:rgba(0,240,255,.6); } #jw.rose { --jc:#f472b6; --jg:rgba(244,114,182,.5); }
  #jw.emerald { --jc:#34d399; --jg:rgba(52,211,153,.5); } #jw.royal { --jc:#a78bfa; --jg:rgba(167,139,250,.55); }

<body>

<script>
const q = new URLSearchParams(location.search);
let CFG = { ...DEFAULT_CFG, ...store.get('lsx-cfg', {}) };
const SLOT = q.get('slot');
const pickTpl = () => SLOT
  ? (TEMPLATES.find(x => x.id === (CFG.slots || {})[SLOT]) || TEMPLATES.find(x => slotKey(x) === SLOT) || { view: SLOT })

const pct = (a, b) => Math.min(100, a / (+b || 1) * 100);

const S = DEMO
  ? { gifts: 6, follows: 42, likes: 3420, secs: 754, vsA: 62, vsB: 38, board: { 'سارة': 120, 'Ahmed': 85, 'Lina': 60, 'خالد': 41, 'Noor': 22 }, lboard: { 'Noor': 900, 'سارة': 640, 'Lina': 410, 'Ahmed': 300, 'خالد': 120 }, recent: ['🎁 سارة ×3', '➕ Ahmed', '⭐ Lina', '🎁 Noor ×1', '➕ خالد'] }
  : store.get('lsx-state', { gifts: 0, follows: 0, likes: 0, board: {}, secs: 900 });
S.lboard = S.lboard || {}; S.recent = S.recent || [];
const save = () => { if (!DEMO) store.set('lsx-state', S); };

// ---- per-template look chosen in the dashboard's "customise" drawer ----
const OPT = { rows: 5, bg: 82, glow: '', scale: 100, anim: 'slide', custom: false };
function readOpts() {
  const o = (CFG.tplOpts || {})[TPL.id];
  Object.assign(OPT, { rows: 5, bg: 82, glow: '', scale: 100, anim: 'slide', custom: !!o }, o || {});
}
function applyOpts() {
  document.documentElement.style.setProperty('--bgA', OPT.bg / 100);
  root.style.zoom = OPT.scale / 100;
  root.style.filter = OPT.glow ? `drop-shadow(0 0 14px ${OPT.glow}) drop-shadow(0 0 30px ${OPT.glow}88)` : '';
}
readOpts(); applyOpts();
// cloud TTS: OBS fetches MP3 from /tts/<token>; the dashboard preview uses the logged-in /api/tts route (see speakAuto in shared.js)
window.SG_TTS_BASE = q.get('k') ? '/tts/' + encodeURIComponent(q.get('k')) : '/api/tts';
Object.defineProperty(window, 'SG_TTS_OPTS', { get: () => CFG.tts });
// requestAnimationFrame is paused in hidden tabs; this falls back to a timer so counters and the wheel still finish
const raf = (fn) => { let done = false; const go = (t) => { if (done) return; done = true; fn(t || performance.now()); }; setTimeout(go, 90); requestAnimationFrame(go); };
let SIM = false; // true while the dashboard drives this frame with simulated events

// visual for a (simulated) gift: the emoji floats up with the sender's name
const GIFT_EMOJI = { bits: '💎', 'gift sub': '🎁', rose: '🌹', lion: '🦁', heart: '💖', 'tiktok universe': '🌌', galaxy: '🌌', default: '🎁' };
function giftFx(ev) {
  let box = document.getElementById('gfx');
  if (!box) { box = document.createElement('div'); box.id = 'gfx'; box.style.cssText = 'position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden'; document.body.appendChild(box); }
  const e = document.createElement('div'), em = GIFT_EMOJI[String(ev.gift || '').toLowerCase()] || GIFT_EMOJI.default;
  e.style.cssText = `position:absolute;left:${15 + Math.random() * 65}%;bottom:-6%;text-align:center;animation:giftRise 2.4s ease-out forwards`;
  e.innerHTML = `<div style="font-size:${46 + Math.min(40, (ev.count || 1) * 4)}px;filter:drop-shadow(0 0 12px #ff2d8a)">${em}</div><div style="font:800 14px Cairo,sans-serif;background:rgba(10,14,26,.88);padding:2px 10px;border-radius:99px;border:1px solid #ff2d8a;white-space:nowrap">${esc(ev.user || '')} ×${ev.count || 1}</div>`;
  box.appendChild(e);
  for (let i = 0; i < 6; i++) { const s = document.createElement('span'); s.textContent = ['✨', '💖', '⭐'][i % 3]; s.style.cssText = `position:absolute;left:${10 + Math.random() * 80}%;bottom:${Math.random() * 30}%;font-size:${14 + Math.random() * 14}px;animation:rise ${1.2 + Math.random()}s ease-out forwards`; box.appendChild(s); setTimeout(() => s.remove(), 2400); }
  setTimeout(() => e.remove(), 2600);
}
// the dashboard (same origin) can drive a preview frame: simulated events and live option changes
addEventListener('message', (m) => {
  if (m.origin !== location.origin || !m.data || !m.data.sg) return;
  if (m.data.sg === 'event') { SIM = true; handle({ ...m.data.ev, ts: Date.now() + Math.random() }); }
  if (m.data.sg === 'opts') { Object.assign(OPT, m.data.opts || {}, { custom: true }); applyOpts(); V.draw(); }
});

let popTimer;

  clearTimeout(popTimer); popTimer = setTimeout(() => p.classList.remove('on'), 3500);

// ---- leaderboard theme rows ----
const ROW_H = 54;
let topRowsMap = new Map(), topFirst = true;
function tweenNum(el, from, to) { // smooth count-up of a score
  const t0 = performance.now(), d = 600;
  const step = (t) => { const k = Math.min(1, (t - t0) / d), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3))); el.textContent = v; if (k < 1) raf(step); };
  raf(step);
}
// leaderboard with smooth re-ordering: rows are keyed by viewer name and slide to their new place
function renderTop() {

  box.style.height = Math.max(1, data.length) * ROW_H + 'px';
  const keep = new Set(data.map(d => d[0]));
  for (const [name, el] of [...topRowsMap]) if (!keep.has(name)) { el.style.opacity = 0; setTimeout(() => el.remove(), 450); topRowsMap.delete(name); }
  if (!data.length && !topRowsMap.has('\u0000empty')) { const e = document.createElement('div'); e.className = 'toprow'; e.style.cssText = `background:rgba(10,14,26,var(--bgA,.88));border:1px solid ${c1}66;top:0;opacity:.7`; e.innerHTML = '<span style="flex:1;text-align:center">بانتظار الهدايا…</span>'; box.appendChild(e); topRowsMap.set('\u0000empty', e); }
  if (data.length && topRowsMap.has('\u0000empty')) { topRowsMap.get('\u0000empty').remove(); topRowsMap.delete('\u0000empty'); }

      el.style.cssText = `background:linear-gradient(90deg,${c1}33,rgba(10,14,26,var(--bgA,.88)));border:1px solid ${c1}99;top:${i * ROW_H}px`;
      el.innerHTML = `<span class="ic">${ic}</span><span style="width:30px;height:30px;border-radius:50%;background:${c2};color:#111;display:grid;place-items:center;font-weight:900;flex:none">${esc(name).slice(0, 1)}</span><span style="flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</span><span style="background:${c1}44;border-radius:99px;padding:2px 10px;font-weight:800;flex:none">${mode === 'likes' ? '❤️' : '🎁'} <span class="sc" dir="ltr">${score}</span></span>`;
      el._score = score; box.appendChild(el); topRowsMap.set(name, el);
    } else if (el._score !== score) {
      const sc = el.querySelector('.sc'); tweenNum(sc, el._score, score); el._score = score;
      sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump');
    }
    el.style.top = i * ROW_H + 'px';
    el.style.boxShadow = `0 0 ${i ? 8 : 20}px ${c1}66`; el.style.transform = i === 0 ? 'scale(1.04)' : '';

  topFirst = false;
}

// ---- goal helpers ----
const goalCur = () => DEMO ? 62 + (S.gifts - 6) : (+CFG.goal.cur || 0) + (CFG.goal.src === 'gifts' ? S.gifts : CFG.goal.src === 'follows' ? S.follows : 0);

// ---- tap ("تكبيس") goal counter: the running like total climbing toward 1000 → 5000 → 10000 ... ----
const tapTargets = () => (CFG.taps.targets || []).map(Number).filter(n => n > 0).sort((a, b) => a - b);

}
const tapHead = (g) => `<div style="font-weight:800;font-size:20px;margin-bottom:6px">❤️ ${esc(g.title)}</div>`;
const tapNum = (size, color) => `<div dir="ltr" style="font-weight:900;line-height:1"><b id="tn" style="font-size:${size}px;color:${color};text-shadow:0 0 14px ${color}88;font-variant-numeric:tabular-nums">0</b><span style="opacity:.7;font-size:${Math.round(size * .5)}px"> / <span id="tt"></span></span></div>`;
const barRow = (c1, c2, h = 20) => `<div class="bar" style="height:${h}px"><i id="tf" style="background:linear-gradient(90deg,${c1},${c2})"></i></div>`;

  heart: { html: (g) => `<div style="display:flex;align-items:center;gap:20px" dir="ltr"><svg width="190" height="170" viewBox="0 0 100 90"><defs><clipPath id="hc"><rect id="hf" x="0" y="90" width="100" height="90"/></clipPath><linearGradient id="hg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${g.c1}"/><stop offset="1" stop-color="${g.c2}"/></linearGradient></defs><path d="${HEART}" fill="rgba(255,255,255,.1)" stroke="${g.c1}" stroke-width="2.5"/><path d="${HEART}" fill="url(#hg)" clip-path="url(#hc)"/></svg><div>${tapHead(g)}${tapNum(46, g.c1)}</div></div>`, fill: (p) => { $i('hf').setAttribute('y', 90 - 90 * p / 100); } },
  ring: { html: (g) => `<div class="card" style="display:flex;align-items:center;gap:18px" dir="ltr"><svg width="150" height="150" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12"/><circle id="rg" cx="60" cy="60" r="50" fill="none" stroke="${g.c1}" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px ${g.c1})"/><text x="60" y="68" text-anchor="middle" font-size="28">❤️</text></svg><div>${tapHead(g)}${tapNum(40, g.c1)}</div></div>`, fill: (p) => { $i('rg').style.strokeDashoffset = 314 * (1 - p / 100); } },

    window.jarBodies = () => B;
    window.jarReset = () => { B.forEach(o => { o.dead = true; }); coins = 0; donors = {}; $i('jtn').dataset.v = 0; $i('jtn').textContent = '0'; $i('jtop').style.display = 'none'; persist(); };
    // restore what was in the jar before this page was (re)loaded; the gallery preview gets a nice demo pile
    let saved = null; try { saved = DEMO ? null : JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
    if (saved && saved.items) { coins = +saved.coins || 0; donors = saved.donors || {}; saved.items.forEach((it, i) => drop(it.ch, it.r, it.img, i * 14)); drawPills(false); }
    else if (DEMO) { const ch = ['🌹', '❤️', '🦁', '💎', '🌹', '🎁', '🌹', '👑', '🍩', '🌹']; for (let i = 0; i < 46; i++) drop(ch[i % ch.length], 17 + (i % 4) * 3, '', 300 + i * 38); coins = 1280; donors = { 'سارة': { c: 740, av: '' } }; drawPills(false); setTimeout(() => window.jarGift({ user: 'Ahmed', gift: 'Rose', count: 5, diamonds: 5 }), 2600); }
  }, draw: () => {} },
  'fx': { cfg: true, init: () => {
    root.innerHTML = '<div id="fxw"><canvas id="fxc"></canvas></div>'; FXE.init($i('fxc'));
    if (DEMO) { const demo = ['fireworks', 'confetti', 'hearts', 'balloons', 'megafireworks', 'emojirain', 'lightning', 'shockwave', 'stars']; let i = 0; const go = () => { FXE.run(demo[i++ % demo.length], { power: 2 }); }; setTimeout(go, 400); setInterval(go, 3200); }
  }, draw: () => {} },
  'dhikr': { init: () => { root.innerHTML = '<div id="dhw" style="position:absolute;top:60px;left:50%;transform:translateX(-50%)"></div>'; let n = 0; const show = () => { $i('dhw').innerHTML = `<div class="dh ${esc(VAR)}">${esc(DHIKR[n++ % DHIKR.length])}</div>`; }; show(); clearInterval(window.dhT); window.dhT = setInterval(show, DEMO ? 3500 : 9000); }, draw: () => {} },

  'lastsup': { init: () => { root.innerHTML = '<div id="ls" style="position:absolute;top:30px;left:30px"></div>'; }, draw: () => {
    const a = LASTSUP_STYLES[VAR] || LASTSUP_STYLES.neon, r = S.recent.find(x => /🎁/.test(x)) || S.recent[0] || 'بانتظار أول داعم…';
    $i('ls').innerHTML = `<div class="ls" style="--bg:${a[1]};--b:${a[2]};--tx:${a[3]};--g:${a[4]}88;${a[5]}"><span style="font-size:38px">🏅</span><div><small>آخر داعم</small><b>${esc(r)}</b></div></div>`; } },

  'goalt': { cfg: true, init: () => {
    const th = GOAL_THEMES[VAR] || GOAL_THEMES.star, g = CFG.goal;
    root.innerHTML = `<div class="gt" style="--c1:${th[2]};--c2:${th[3]}"><div class="gh"><span>${th[1]} ${esc(g.title)}</span><span id="gn" dir="ltr"></span></div><div class="gb"><i id="f"></i><em id="gm">${th[1]}</em></div></div>`; },
    draw: () => { const cur = goalCur(), tg = goalTgt(), p = pct(cur, tg); $i('gn').textContent = cur + ' / ' + tg; $i('f').style.width = p + '%'; $i('gm').style.left = Math.max(3, Math.min(97, p)) + '%'; } },
  'alerts': { cfg: true, init: () => { root.innerHTML = '<div id="al" style="position:absolute;top:70px;left:50%;transform:translateX(-50%)"></div>'; }, draw: () => {} },

  'taps': { cfg: true, init: () => { shownTaps = S.likes; root.innerHTML = `<div id="tp" style="position:absolute;top:30px;left:30px">${(TAPUI[VAR] || TAPUI.neon).html(CFG.taps)}</div><div id="fx" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>`; }, draw: () => { tapGen++; const gen = tapGen; raf(() => tapFrame(gen)); } },

  'wheel': { cfg: true,
    init: () => { root.innerHTML = `<div id="wh" style="width:560px;text-align:center"><div style="font:900 28px Cairo,sans-serif;margin-bottom:8px;text-shadow:0 2px 12px #000">🎡 ${esc(CFG.wheel.title)}</div><div style="position:relative;width:520px;height:520px;margin:0 auto"><canvas id="wc" width="520" height="520"></canvas><div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:50px;filter:drop-shadow(0 0 8px #000);line-height:1">🔻</div></div><div id="wr" style="height:56px;margin-top:10px;font:900 34px Cairo,sans-serif"></div></div>`; },
    draw: () => drawWheel() },

  'tts': { cfg: true,
    init: () => { root.innerHTML = `<div class="card" id="tts" style="display:inline-flex;align-items:center;gap:12px;font-weight:800"><span>🔊 قارئ التعليقات ${CFG.tts.engine === 'browser' ? '(صوت المتصفح)' : '☁️ (صوت سحابي)'}</span><span id="ts" style="opacity:.75;font-weight:600">جاهز</span><button id="tb" style="font:inherit;padding:4px 12px;border-radius:99px;border:0;background:linear-gradient(90deg,#00F0FF,#9d4edd);color:#06121a;font-weight:800;cursor:pointer">اضغط لتفعيل الصوت</button></div>`; $i('tb').onclick = () => { speakWith(' ', { volume: 0 }); try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); } catch {} $i('tb').remove(); }; if (window.obsstudio) $i('tts').style.display = 'none'; },
    draw: () => {} },

  'canvas': { init: () => { root.style.padding = '0'; root.innerHTML = '<div id="cv" style="position:absolute;left:0;top:0;overflow:hidden"></div>'; }, draw: layoutCanvas },

  'hearts': { init: () => { root.innerHTML = '<div style="position:absolute;right:30px;bottom:20px;width:180px;height:100%;pointer-events:none" id="hr"></div><div class="card" style="position:absolute;left:20px;top:20px;font-size:26px;font-weight:900">❤️ <span id="lk"></span></div>'; }, draw: () => { $i('lk').textContent = S.likes; } },

  'top': { init: () => { topRowsMap = new Map(); topFirst = true; root.innerHTML = '<div id="tl" style="width:340px;position:relative"></div>'; }, draw: renderTop },

  'social': { cfg: true, init: () => {
      injectSoc(); clearInterval(window.socT);
      let list = []; try { list = q.get('s') ? JSON.parse(q.get('s')) : (CFG.social || []); } catch {}
      if (!list.length) list = [{ p: 'tiktok', h: '@your_name' }];
      const html = (it) => socHTML({ ...it, st: VAR || it.st });
      root.innerHTML = '<div id="sc" style="position:absolute;top:30px;left:50%;transform:translateX(-50%);transition:opacity .4s"></div>';
      let i = 0; const show = () => { $i('sc').style.opacity = 0; setTimeout(() => { $i('sc').innerHTML = html(list[i++ % list.length]); $i('sc').style.opacity = 1; }, 400); };
      $i('sc').innerHTML = html(list[i++ % list.length]);
      if (list.length > 1) window.socT = setInterval(show, 6000);
    }, draw: () => {} },

  'chat': { init: () => { root.innerHTML = `<div class="card chat ${VAR}" id="c" style="width:400px;max-height:380px;overflow:hidden"></div>`; if (VAR === 'bubble') { $i('c').style.background = 'transparent'; $i('c').style.border = '0'; } }, draw: () => {} },

  'uchat': { init: () => { root.innerHTML = '<div id="uc"></div>'; $i('uc').style.setProperty('--ucfs', (CFG.uchat.fs || 22) + 'px'); },
    draw: () => { const u = $i('uc'); if (!u) return; u.style.setProperty('--ucfs', (CFG.uchat.fs || 22) + 'px'); while (u.children.length > CFG.uchat.max) u.firstChild.remove(); } },

  'ticker': { cfg: true, init: () => { root.innerHTML = `<div id="tk" class="${VAR}"><span id="tt" style="display:inline-block;padding-left:100%"></span></div>`; },
    draw: () => {
      const k = CFG.ticker; $i('tk').style.display = k.on ? '' : 'none';
      const top = Object.entries(S.board).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u, c], i) => `${['🥇', '🥈', '🥉'][i]} ${u} (${c})`);
      const parts = [];
      if (k.text) parts.push(k.text);
      if (k.mode !== 'top') parts.push(...S.recent.slice(0, 5));
      if (k.mode !== 'latest') parts.push(...top);
      const tt = $i('tt'); tt.textContent = (parts.length ? parts : ['بانتظار الأحداث…']).join('   ✦   ') + '   ✦   ';
      tt.style.animation = `mq ${Math.max(12, tt.scrollWidth / (+k.speed || 40))}s linear infinite`;
    } },

  'recent': { init: () => { root.innerHTML = '<div id="rc" style="width:320px;display:grid;gap:8px"></div>'; },
    draw: () => {
      const cards = VAR === 'cards';
      $i('rc').innerHTML = (S.recent.length ? S.recent : ['بانتظار الأحداث…']).slice(0, OPT.custom ? OPT.rows : 6).map((t, i) => cards
        ? `<div style="padding:10px 16px;border-radius:14px;background:linear-gradient(90deg,#9d4edd55,rgba(10,14,26,.85));border:1px solid #9d4edd88;font-weight:700;animation:slide .4s">${esc(t)}</div>`
        : `<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,.15);font-weight:700;opacity:${1 - i * .13};text-shadow:0 1px 6px #000;animation:slide .4s">${esc(t)}</div>`).join('');
    } },

  'counter': { init: () => { root.innerHTML = '<div class="card" style="display:inline-flex;align-items:center;gap:16px;padding:14px 26px;border:2px solid #00F0FF;box-shadow:0 0 26px #00F0FF77"><span id="ci" style="font-size:44px"></span><div><div id="cl" style="opacity:.75;font-weight:700;letter-spacing:1px"></div><div id="cn" style="font-size:54px;font-weight:900;line-height:1;color:#00F0FF;text-shadow:0 0 14px #00F0FF;font-variant-numeric:tabular-nums"></div></div></div>'; },
    draw: () => { const [ic, lb, get] = COUNTERS[VAR] || COUNTERS.gifts; $i('ci').textContent = ic; $i('cl').textContent = lb; $i('cn').textContent = get(); } },

  'versus': { init: () => { const [a, b] = VS[VAR] || VS.neon; root.innerHTML = `<div class="card" style="width:560px;border-color:${a}88"><div class="row" style="font-weight:900;font-size:22px"><b style="color:${a}">الفريق A</b><b style="color:${b}">الفريق B</b></div><div class="bar" style="height:24px;background:${b}"><i id="f" style="width:50%;background:${a};box-shadow:0 0 16px ${a}"></i></div><div class="row" style="font-size:26px;font-weight:900"><span id="a">0</span><span id="b">0</span></div></div>`; },
    draw: () => { const a = S.vsA || 0, b = S.vsB || 0; $i('a').textContent = a; $i('b').textContent = b; $i('f').style.width = (a + b ? a / (a + b) * 100 : 50) + '%'; } },
};
const V = views[T] || views['gift-rocket'];
V.init(); V.draw();

// settings: live from the server in OBS (?k=), from localStorage/BroadcastChannel in the dashboard
const applyCfg = (c) => {
  CFG = { ...DEFAULT_CFG, ...c };
  if (q.get('k')) store.set('lsx-cfg', CFG); // cache it, so the reload below already resolves the chosen template
  // the style was switched in the dashboard: reload once (window.name guards against reload loops if storage is blocked)
  if (SLOT && (pickTpl().id || '') !== (TPL.id || '') && Date.now() - (+String(window.name).replace('sg:', '') || 0) > 4000) { window.name = 'sg:' + Date.now(); location.reload(); return; }
  readOpts(); applyOpts();
  if (V.cfg) { V.init(); V.draw(); } else V.draw();
};
if (q.get('k')) fetch('/cfg/' + q.get('k')).then(r => r.json()).then(applyCfg).catch(() => {});

// ---- alerts engine: queue, show card, play sound, speak ----
const aq = []; let busy = false;
const ONLY_KEYS = { follow: ['follow'], like: ['like', 'milestone'] }; // single-purpose templates (follow-*, like-burst)
const BIG = new Set(['bigGift', 'milestone', 'goal']);
const tapAcc = {}; // taps ("تكبيس") per viewer since their last tap alert
// which configured alerts does this event trigger? -> [[settings, event, key], ...]
function alertsFor(ev, prevLikes) {
  const A = CFG.alerts, out = [];
  const add = (k, extra = {}) => { const c = A[k]; if (c && c.on) out.push([c, { ...ev, ...extra }, k]); };
  if (ev.type === 'gift') { const b = A.bigGift; if (b && b.on && (ev.diamonds || 0) >= (+b.min || 100)) add('bigGift'); else add('gift'); }
  else if (['follow', 'sub', 'share', 'join', 'raid'].includes(ev.type)) add(ev.type);
  else if (ev.type === 'like') {
    const c = A.like;
    if (c && c.on) { tapAcc[ev.user] = (tapAcc[ev.user] || 0) + (ev.count || 1); if (tapAcc[ev.user] >= (+c.min || 50)) { add('like', { count: tapAcc[ev.user] }); tapAcc[ev.user] = 0; } }
    const m = A.milestone, step = +(m && m.min) || 1000;
    if (m && m.on && Math.floor(S.likes / step) > Math.floor(prevLikes / step)) out.push([m, { ...ev, user: '', total: Math.floor(S.likes / step) * step }, 'milestone']);
  }
  const g = A.goal, cur = goalCur(), tg = goalTgt();
  if (g && g.on && !DEMO) { if (cur >= tg && !S.goalDone) { S.goalDone = true; out.push([g, { ...ev, user: '', title: CFG.goal.title }, 'goal']); } else if (cur < tg) S.goalDone = false; }
  return out;
}
function runAlert() {
  if (busy || !aq.length) return; busy = true;
  const [c, ev, key] = aq.shift();
  const text = (TPL.txt && key !== 'bigGift' && key !== 'goal' ? TPL.txt : c.text).replace(/\{dhikr\}/g, () => DHIKR[Math.random() * DHIKR.length | 0]).replace(/\{user\}/g, ev.user || '').replace(/\{gift\}/g, ev.gift || '').replace(/\{count\}/g, ev.count || 1).replace(/\{total\}/g, ev.total || '').replace(/\{title\}/g, ev.title || '').replace(/\{diamonds\}/g, ev.diamonds || '');
  const big = BIG.has(key);
  $i('al').innerHTML = `<div class="alc al-${VAR || 'neon'} an-${OPT.anim}${big ? ' big' : ''}" style="--c:${esc(TPL.c || c.color)}">${c.img ? `<img src="${esc(c.img)}">` : ''}<div>${esc(text)}</div></div>`;
  if (big) confetti();
  if (!DEMO) { playSound(c.sound, c.audio); if (c.tts) speak(text); }
  setTimeout(() => { $i('al').innerHTML = ''; busy = false; runAlert(); }, DEMO ? 2800 : big ? 7000 : 5200);
}
function confetti() {
  const box = $i('al'); if (!box) return;
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span'); s.textContent = ['🎉', '✨', '💎', '⭐', '🔥'][i % 5];
    s.style.cssText = `position:absolute;left:${Math.random() * 100}%;top:60%;font-size:${20 + Math.random() * 22}px;pointer-events:none;animation:rise ${1.6 + Math.random() * 1.4}s ease-out forwards;animation-delay:${Math.random() * .5}s`;
    box.appendChild(s);
  }
}
function floatHeart(n) {
  for (let i = 0; i < Math.min(n, 8); i++) setTimeout(() => {
    const h = document.createElement('div'); h.textContent = ['❤️', '💖', '💗', '💜'][Math.random() * 4 | 0];
    h.style.cssText = `position:absolute;bottom:0;left:${Math.random() * 140}px;font-size:${28 + Math.random() * 26}px;animation:rise ${2.4 + Math.random()}s ease-out forwards`;
    $i('hr').appendChild(h); setTimeout(() => h.remove(), 3600);
  }, i * 120);
}
// unified chat line: messages are appended in the order the server received them (TikTok and Twitch share one event stream)
function uchatAdd(ev) {
  const c = $i('uc'), U = CFG.uchat; if (!c) return;
  const pf = ev.platform === 'twitch' ? 'twitch' : ev.platform === 'kick' ? 'kick' : 'tiktok';
  if (!String(ev.text || '').trim()) return; // sticker/emote-only comments arrive with no text
  if (!U[pf] || (U.hideBots && ev.bot) || (U.hideCmds && String(ev.text).trim().startsWith('!'))) return;
  const bot = !!ev.bot, icon = U.badge !== 'text', badge = icon ? (pf === 'twitch' ? '🟣' : pf === 'kick' ? '🟩' : '🎵') : (pf === 'twitch' ? 'TWITCH' : pf === 'kick' ? 'KICK' : 'TIKTOK');
  const el = document.createElement('div'); el.className = `ucl ${VAR || 'card'} ${pf}`;
  el.innerHTML = `<span class="pb ${pf}${icon ? ' ic' : ''}">${badge}</span><span class="un ${bot ? 'bot' : pf}">${bot ? '🤖 ' : ''}${esc(ev.user)}${ev.sub ? ' <span class="st">★</span>' : ''}</span><span class="ut">${esc(ev.text)}</span>`;
  c.appendChild(el); trimLines(c, uchatMax(U));
  expireLine(el);
}
// chat lines disappear after the timer (dashboard: «تختفي الرسالة بعد») so only the newest messages stay on screen
// a new message pushes the oldest one out: it fades and is removed, so only the newest N lines stay
function trimLines(c, max) {
  max = Math.max(1, +max || 1);
  let live = [...c.children].filter((x) => !x.classList.contains('fade-out'));
  while (live.length > max) { const old = live.shift(); old.classList.add('fade-out'); setTimeout(() => old.remove(), 450); }
}
function expireLine(el) {
  const s = uchatTtl(CFG.uchat);
  if (s > 0) setTimeout(() => { el.classList.add('fade-out'); setTimeout(() => el.remove(), 650); }, s * 1000);
}
function chatAdd(ev) {
  const c = $i('c'); if (!c) return;
  const n = c.children.length;
  const mark = ev.platform === 'twitch' ? '🟣 ' : ev.platform === 'kick' ? '🟩 ' : '';
  c.insertAdjacentHTML('beforeend', VAR === 'bubble' ? `<span class="bub ${n % 2 ? 'b2' : ''}"><b style="color:#fff;opacity:.85">${mark}${esc(ev.user)}</b> ${esc(ev.text)}</span>` : `<div><b>${mark}${esc(ev.user)}${VAR === 'terminal' ? ' &gt;' : ':'}</b> ${esc(ev.text)}</div>`);
  expireLine(c.lastElementChild);
  trimLines(c, OPT.custom ? OPT.rows + 1 : uchatMax(CFG.uchat));
}

const handle = (ev) => {
  if (ev.type === 'config') { applyCfg(ev.cfg); return; }
  if (ev.type === 'reset') { Object.assign(S, { gifts: 0, follows: 0, likes: 0, board: {}, lboard: {}, secs: 900, vsA: 0, vsB: 0, recent: [] }); }
  const msg = { gift: `🎁 ${ev.user} ×${ev.count || 1}`, follow: `➕ ${ev.user}`, sub: `⭐ ${ev.user}`, share: `🔁 ${ev.user}`, raid: `🚀 ${ev.user} ×${ev.count || 0}` }[ev.type];
  if (msg) S.recent = [msg, ...S.recent].slice(0, 8);
  const prevLikes = S.likes;
  if (ev.type === 'gift') { S.gifts += ev.count || 1; S.board[ev.user] = (S.board[ev.user] || 0) + (ev.count || 1); S.secs += 10 * (ev.count || 1);
    if (ev.team === 'B') S.vsB = (S.vsB || 0) + (ev.count || 1); else S.vsA = (S.vsA || 0) + (ev.count || 1);
    if (T === 'gift-rocket') pop(`🎁 ${esc(ev.user)} أرسل ${esc(ev.gift || 'هدية')} ×${ev.count || 1}`); }
  if (T === 'jar') { if (ev.type === 'reset' || ev.type === 'jarreset') window.jarReset && window.jarReset(); else if ((ev.type === 'gift' || ev.type === 'sub') && window.jarGift) window.jarGift(ev.type === 'sub' ? { ...ev, gift: 'Sub', count: 1, diamonds: 0 } : ev); }
  if (ev.type === 'follow') S.follows++;
  if (ev.type === 'like') { S.likes = ev.total > 0 ? ev.total : S.likes + (ev.count || 1); S.lboard[ev.user] = (S.lboard[ev.user] || 0) + (ev.count || 1); if (T === 'hearts') floatHeart(ev.count || 1); if (T === 'taps') { tapBurst(ev.count || 1); tapCelebrate(prevLikes); } }
  if (T === 'fx') fxHandle(ev, prevLikes);
  if (ev.type === 'chat' && T === 'chat') chatAdd(ev);
  if (ev.type === 'chat' && T === 'uchat') uchatAdd(ev);
  if ((SIM || DEMO) && ev.type === 'gift') giftFx(ev);
  if (T === 'wheel' && (ev.type === 'spin' || wheelTriggered(ev))) spinWheel();
  if (T === 'tts' && ev.type === 'chat' && ev.user !== '🤖' && !ev.noTts) ttsHandle(ev); // AI replies are read too, unless the streamer turned that off
  if (T === 'alerts') {
    const keys = ONLY ? ONLY_KEYS[ONLY] : null;
    alertsFor(ev, prevLikes).filter(a => !keys || keys.includes(a[2])).forEach(a => aq.push(a));
    if (aq.length > 6) aq.splice(0, aq.length - 6); // never let a busy stream build a long backlog
    runAlert();
  }
  save(); V.draw();
};
listen(handle);

// gallery previews: feed the template sample events so it looks alive
if (DEMO) {
  const names = ['سارة', 'Ahmed', 'Lina', 'خالد'];
  const kinds = T === 'taps' ? ['tapdemo'] : T === 'alerts' ? (ONLY ? [ONLY] : ['gift', 'follow', 'big', 'tap', 'share', 'sub']) : T === 'hearts' ? ['like'] : (T === 'chat' || T === 'uchat') ? ['chat'] : [];
  let n = 0;
  // sample events for the alert previews (gifts of different value, a burst of taps, a likes milestone...)
  const sample = (k) => ({ tapdemo: { type: 'like', count: 37 }, big: { type: 'gift', diamonds: 500, gift: 'Lion', count: 1 }, tap: { type: 'like', count: 60 }, like: n % 2 ? { type: 'like', count: 60 } : { type: 'like', count: 1, total: 1000 * (1 + n) } }[k]);
  if (T === 'chat') ['أهلاً بالجميع 👋', 'بث حلو والله', 'كم الهدف اليوم؟'].forEach((t, i) => chatAdd({ user: names[i], text: t }));
  if (T === 'uchat') [['سارة', 'أهلاً بالجميع 👋', 'tiktok'], ['Ninja', 'GG what a play!', 'twitch'], ['خالد', 'بث حلو والله', 'tiktok'], ['Hype', '!hype', 'twitch'], ['Lina', 'وين الهدف؟', 'tiktok'], ['Noor', 'LETS GOOO', 'twitch'], ['Trainwreck', 'KEKW', 'kick']].forEach(([u, t, p], i) => uchatAdd({ user: u, text: t, platform: p, sub: i % 3 === 1 }));
  if (kinds.length) setTimeout(() => setInterval(() => { const k = kinds[n++ % kinds.length]; handle({ type: k, user: names[n % 4], count: 1 + n % 4, gift: 'Rose', text: ['مرحبا!', 'ممتاز 🔥', 'ما شاء الله'][n % 3], ...(sample(k) || {}), ...(T === 'uchat' ? { platform: ['tiktok', 'twitch', 'kick'][n % 3] } : {}), ts: Date.now() + n }); }, 3600), 300);
  if (kinds.length) setTimeout(() => handle({ type: kinds[0] === 'like' ? 'like' : kinds[0] === 'big' ? 'gift' : kinds[0], user: 'سارة', count: kinds[0] === 'like' ? 60 : 3, gift: 'Rose', text: 'مرحبا!', ts: Date.now() }), 400);
}
